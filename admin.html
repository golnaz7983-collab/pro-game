<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pro Game | مدیریت</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Tahoma,Arial,sans-serif}.top{height:70px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#fff;z-index:5}.brand{font-size:25px;font-weight:900}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px;cursor:pointer}.dark{background:#111;color:#fff;border-color:#111}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.hero{margin-bottom:25px}.hero h1{font-size:42px;margin:0 0 10px}.note{color:#666;line-height:1.9}.login{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(440px,100%);border:1px solid #eee;border-radius:20px;padding:28px;box-shadow:0 15px 50px #0000000d}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit}.content{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.stat{border:1px solid #eee;border-radius:16px;padding:20px}.stat b{font-size:28px}.ticket{border:1px solid #e5e5e5;border-radius:17px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #00000007}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.status{background:#eee;border-radius:999px;padding:5px 10px;font-size:12px}.done{background:#e7f7ed;color:#168a4b}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{background:#f5f5f5;border-radius:10px;padding:10px;margin:10px 0}@media(max-width:700px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:32px}}</style></head><body><header class="top"><div class="brand">PRO GAME — مدیریت</div><button class="btn" onclick="location.href='index.html'">بازگشت به سایت</button></header><div id="login" class="login"><div class="box"><h1>ورود مدیر</h1><p class="note">این پنل برای تست نسخه فعلی است.</p><div class="field"><label>رمز مدیر</label><input id="pass" type="password" placeholder="رمز مدیر"></div><button class="btn dark" style="width:100%" onclick="enter()">ورود به پنل</button><div id="msg"></div></div></div><main id="content" class="content"><div class="wrap"><section class="hero"><h1>پنل مدیریت تیکت‌ها</h1><p class="note">تیکت‌ها را ببین، پاسخ بده، نمره بده و وضعیت را انجام‌شده کن.</p></section><section class="stats"><div class="stat"><div>کل تیکت‌ها</div><b id="all">0</b></div><div class="stat"><div>در انتظار</div><b id="pending">0</b></div><div class="stat"><div>انجام شده</div><b id="done">0</b></div></section><section id="tickets"></section></div></main><script>const KEY='pg_tickets',PASS='ProGame@2026';function $(x){return document.getElementById(x)}function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function enter(){if($('pass').value!==PASS){$('msg').textContent='رمز اشتباه است.';return}$('login').style.display='none';$('content').style.display='block';render()}function render(){let a=data();$('all').textContent=a.length;$('pending').textContent=a.filter(x=>x.status!=='انجام شد').length;$('done').textContent=a.filter(x=>x.status==='انجام شد').length;$('tickets').innerHTML=a.length?a.map(t=>`<article class="ticket"><div class="head"><h2 style="margin:0">${t.game} — ${t.id}</h2><span class="status ${t.status==='انجام شد'?'done':''}">${t.status}</span></div><p><b>نام حساب:</b> ${t.account}<br><b>نام در بازی:</b> ${t.playerName}<br><b>ایدی:</b> ${t.playerId}<br><b>زمان:</b> ${t.created}</p><div class="msg">${t.text}</div><div class="field"><label>پاسخ مدیر</label><textarea id="r-${t.id}" rows="4">${t.result||''}</textarea></div><div class="row"><div class="field"><label>نمره از ۱۰</label><input id="s-${t.id}" type="number" min="0" max="10" value="${t.score??''}"></div><div class="field"><label>وضعیت</label><select id="st-${t.id}"><option ${t.status==='در حال بررسی'?'selected':''}>در حال بررسی</option><option ${t.status==='بررسی شد'?'selected':''}>بررسی شد</option><option ${t.status==='انجام شد'?'selected':''}>انجام شد</option><option ${t.status==='رد شد'?'selected':''}>رد شد</option></select></div></div><div class="actions"><button class="btn dark" onclick="save('${t.id}')">ذخیره نتیجه</button><button class="btn" onclick="done('${t.id}')">علامت انجام شد</button></div></article>`).join(''):'<div class="msg">هنوز تیکتی ثبت نشده.</div>'}function save(id){let a=data(),t=a.find(x=>x.id===id);if(!t)return;t.result=$('r-'+id).value.trim();let s=$('s-'+id).value;t.score=s===''?null:Number(s);t.status=$('st-'+id).value;localStorage.setItem(KEY,JSON.stringify(a));render();alert('نتیجه ذخیره شد.')}function done(id){let a=data(),t=a.find(x=>x.id===id);if(!t)return;t.status='انجام شد';localStorage.setItem(KEY,JSON.stringify(a));render()} </script></body></html>

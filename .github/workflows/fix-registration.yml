name: Fix registration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable index
        run: |
          git fetch --no-tags origin 73843a6941a3e799aa1d1bc70366afbcb3e67249
          git checkout 73843a6941a3e799aa1d1bc70366afbcb3e67249 -- index.html
          rm -f .github/workflows/theme-update.yml .github/workflows/restore-site.yml .github/workflows/fix-registration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix registration and restore stable site"
          git push
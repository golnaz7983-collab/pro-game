name: Add optional gaming dark mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme switcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="themeToggle"' in s:
              raise SystemExit(0)

          css = r'''<style id="proGameTheme">
          :root{--bg:#fff;--text:#111;--panel:#fff;--border:#e7e7e7;--muted:#777;--soft:#f7f7f7;--accent:#7c3aed;--accent2:#06b6d4}
          body.theme-gaming{background:radial-gradient(circle at 20% 0%,#1b1040 0,#090914 38%,#05050b 100%)!important;color:#f5f5ff!important;background-attachment:fixed}
          body.theme-gaming header{background:#090914eF!important;border-bottom:1px solid #7c3aed66!important;backdrop-filter:blur(12px)}
          body.theme-gaming .logo{color:#fff;text-shadow:0 0 16px #7c3aed}
          body.theme-gaming nav button,body.theme-gaming .ghost{background:#121225!important;color:#fff!important;border-color:#6d28d9!important}
          body.theme-gaming .hero h1{color:#fff;text-shadow:0 0 20px #7c3aed99}
          body.theme-gaming .card,body.theme-gaming .box,body.theme-gaming .modalbox,body.theme-gaming .authCard{background:#10101d!important;color:#f5f5ff!important;border-color:#6d28d966!important;box-shadow:0 0 28px #7c3aed22,0 10px 35px #0008}
          body.theme-gaming .cover{background:linear-gradient(135deg,#15152b,#090914)!important}
          body.theme-gaming .body p,body.theme-gaming .muted{color:#aaaad0!important}
          body.theme-gaming .btn{background:linear-gradient(90deg,#7c3aed,#06b6d4)!important;color:#fff!important;box-shadow:0 0 18px #7c3aed44}
          body.theme-gaming .btn:hover{filter:brightness(1.15)}
          body.theme-gaming input,body.theme-gaming textarea,body.theme-gaming select{background:#0b0b16!important;color:#fff!important;border-color:#5b21b6!important}
          body.theme-gaming .req,body.theme-gaming .queue,body.theme-gaming .nextBox,body.theme-gaming .ticket{background:#151526!important;border-color:#6d28d955!important;color:#fff!important}
          body.theme-gaming .archive{border-color:#6d28d955!important}
          body.theme-gaming .actions button{background:#17172a!important;color:#fff!important;border-color:#6d28d9!important}
          .themeBtn{border:1px solid #7c3aed!important;background:linear-gradient(135deg,#17172a,#0b0b15)!important;color:#fff!important;border-radius:12px!important;padding:9px 12px!important;cursor:pointer;font-weight:700;box-shadow:0 0 14px #7c3aed33}
          .themeBtn:hover{transform:translateY(-1px);filter:brightness(1.1)}
          @media(max-width:520px){.themeBtn{padding:8px 10px}}
          </style>'''

          button = '<button id="themeToggle" class="themeBtn" type="button" onclick="toggleTheme()">🎮 حالت گیمینگ</button>'
          script = r'''<script id="proGameThemeScript">
          function applyTheme(){
            const gaming=localStorage.getItem('pg_theme')==='gaming';
            document.body.classList.toggle('theme-gaming',gaming);
            const b=document.getElementById('themeToggle');
            if(b)b.textContent=gaming?'☀️ حالت معمولی':'🎮 حالت گیمینگ';
          }
          function toggleTheme(){
            localStorage.setItem('pg_theme',localStorage.getItem('pg_theme')==='gaming'?'light':'gaming');
            applyTheme();
          }
          applyTheme();
          </script>'''

          s = s.replace('</style></head>', '</style>'+css+'</head>', 1)
          s = s.replace('<nav><button onclick="checkOpen()">🔎 چک تیکت</button> <button onclick="accountOpen()">👤 حساب</button></nav>', '<nav><button onclick="checkOpen()">🔎 چک تیکت</button> <button onclick="accountOpen()">👤 حساب</button> '+button+'</nav>', 1)
          s = s.replace('</script></body></html>', script+'</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit theme change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add optional gaming dark mode"
          git push

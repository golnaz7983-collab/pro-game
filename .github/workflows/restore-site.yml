name: Restore Pro Game site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore last working site
        run: |
          git show 73843a6941a3e799aa1d1bc70366afbcb3e67249:index.html > index.html
          rm -f .github/workflows/theme-update.yml .github/workflows/restore-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/theme-update.yml .github/workflows/restore-site.yml
          git commit -m "Restore working site and preserve accounts" || exit 0
          git push

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pro Game</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Tahoma,Arial,sans-serif}.authPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authCard{width:min(430px,100%);border:1px solid #e7e7e7;border-radius:18px;padding:28px;background:#fff;box-shadow:0 10px 35px #0001}.authCard h1{text-align:center;margin:0 0 8px}.muted{color:#777;font-size:13px}.authCard .muted{text-align:center}.authCard .btn{margin-top:8px}header{height:64px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#fff;z-index:5}.logo{font-size:25px;font-weight:900}.logo span{font-weight:400}nav button,.ghost{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}main{max-width:1150px;margin:auto;padding:28px 16px 60px}.hero h1{font-size:38px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.card{border:1px solid #e7e7e7;border-radius:17px;overflow:hidden;box-shadow:0 6px 20px #0001}.cover{height:165px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}.cover img{max-width:75%;max-height:115px}.fallback{font-size:30px;font-weight:900}.body{padding:16px}.body h3{margin:0 0 8px}.body p{color:#777;font-size:13px;min-height:34px}.btn{width:100%;border:0;background:#111;color:#fff;border-radius:10px;padding:11px;cursor:pointer}.btn:hover{background:#333}.box{border:1px solid #e5e5e5;border-radius:15px;padding:18px;margin-top:28px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-family:inherit}textarea{min-height:95px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.hidden{display:none!important}.modalbox{width:min(500px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:20px}.adminbox{width:min(1150px,97vw);max-height:94vh}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.req{background:#f7f7f7;padding:11px;border-radius:10px;margin:10px 0;font-size:13px}.ticket{border:1px solid #eee;padding:15px;border-radius:12px;margin:12px 0;background:#fff}.ticketHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{cursor:pointer;border:1px solid #ddd;background:#fff;padding:8px;border-radius:9px}.pos{background:#e8f7eb!important}.neg{background:#ffe8e8!important}.status{font-size:12px;padding:5px 8px;border-radius:15px;background:#eee}.adminTools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0;padding:12px;background:#fafafa;border-radius:12px}.small{font-size:12px}.code{font-family:monospace;font-weight:700;direction:ltr;display:inline-block}.queue{border:2px solid #111;border-radius:14px;padding:14px;margin:12px 0;background:#fafafa}.archive{margin-top:22px;border-top:1px solid #eee;padding-top:14px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.adminTools{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.row,.adminTools{grid-template-columns:1fr}.hero h1{font-size:30px}header{padding:0 12px}.authCard{padding:22px}}</style></head><body><section id="authPage" class="authPage"><div class="authCard"><h1>PRO GAME 🎮</h1><p class="muted">برای ورود به سایت، حساب خودت را بساز یا وارد شو.</p><div class="field"><label>نام</label><input id="an" autocomplete="username" placeholder="نام کاربری"></div><div class="field"><label>رمز</label><input id="ap" type="password" autocomplete="current-password" placeholder="رمز حساب"></div><button id="continueBtn" class="btn" type="button">ثبت نام و ادامه</button><p id="authMsg" class="muted"></p></div></section><div id="app" class="hidden"><header><div class="logo">PRO <span>GAME</span></div><nav><button onclick="checkOpen()">🔎 چک تیکت</button> <button onclick="accountOpen()">👤 حساب</button></nav></header><main><div class="hero"><h1>Pro Game 🎮</h1><p class="muted">بازی را انتخاب کن، مشخصات را ببین و تیکت ثبت کن.</p></div><p id="who" class="muted"></p><div id="games" class="grid"></div><section id="check" class="box hidden"><div class="top"><h2>چک تیکت</h2><button class="ghost" onclick="checkClose()">بستن</button></div><div class="row"><div class="field"><label>شماره تیکت</label><input id="cid" placeholder="مثلاً PG-0001"></div><div class="field"><label>کد پیگیری</label><input id="ccode" placeholder="کد پیگیری"></div></div><button class="btn" onclick="checkTicket()">بررسی</button><div id="cres"></div></section></main></div><div id="game" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="gt"></h2><button class="ghost" onclick="gameClose()">×</button></div><div id="gi"></div><button class="btn" onclick="ticketOpen()">🎫 ثبت تیکت</button></div></div><div id="ticket" class="modal hidden"><div class="modalbox"><div class="top"><h2>ثبت تیکت</h2><button class="ghost" onclick="ticketClose()">×</button></div><p id="tg" class="muted"></p><div class="row"><div class="field"><label>اسم</label><input id="tn"></div><div class="field"><label>آیدی</label><input id="ti"></div></div><div class="field"><label>نام اکانت</label><input id="ta"></div><div class="field"><label>توضیحات</label><textarea id="td"></textarea></div><button class="btn" onclick="send()">ارسال تیکت</button><div id="sent"></div></div></div><div id="acc" class="modal hidden"><div class="modalbox"><div class="top"><h2>حساب من</h2><button class="ghost" onclick="accountClose()">×</button></div><div id="ainfo"></div><button class="btn" onclick="adminLogin()">🔐 بخش مدیر</button><button class="btn" style="margin-top:8px" onclick="logout()">خروج</button></div></div><div id="admin" class="modal hidden"><div class="modalbox adminbox"><div class="top"><div><h2 style="margin:0">مدیریت تیکت‌ها</h2><p class="muted" style="margin:5px 0">تیکت‌ها به ترتیب بررسی می‌شوند؛ تیکت انجام‌شده حذف نمی‌شود و وارد آرشیو دائمی می‌شود.</p></div><button class="ghost" onclick="adminClose()">بستن</button></div><div id="adminStats" class="req"></div><div id="alist"></div></div></div><script>const ADMIN="promatin1234",G=[["Minecraft","https://cdn.simpleicons.org/minecraft/111111","نام کاربری، آیدی، نام اکانت و توضیحات"],["GTA V","https://cdn.simpleicons.org/grandtheftauto/111111","نام اکانت، آیدی و مشخصات درخواست"],["Counter-Strike 2","https://cdn.simpleicons.org/counterstrike/111111","آیدی، نام اکانت و توضیحات"],["Fortnite","https://cdn.simpleicons.org/fortnite/111111","Epic ID، نام اکانت و توضیحات"],["PUBG: BATTLEGROUNDS","https://cdn.simpleicons.org/pubg/111111","Player ID، نام اکانت و توضیحات"],["Call of Duty","https://cdn.simpleicons.org/callofduty/111111","Player ID، نام اکانت و توضیحات"],["Free Fire","https://cdn.simpleicons.org/freefire/111111","Player ID، نام اکانت و توضیحات"],["Roblox","https://cdn.simpleicons.org/roblox/111111","نام کاربری، آیدی و توضیحات"]];let cur=0;const $=id=>document.getElementById(id),an=$("an"),ap=$("ap"),authPage=$("authPage"),authMsg=$("authMsg"),app=$("app"),games=$("games"),who=$("who"),gt=$("gt"),gi=$("gi"),tg=$("tg"),tn=$("tn"),ti=$("ti"),ta=$("ta"),td=$("td"),sent=$("sent"),check=$("check"),cid=$("cid"),ccode=$("ccode"),cres=$("cres"),ainfo=$("ainfo"),acc=$("acc"),admin=$("admin"),alist=$("alist"),adminStats=$("adminStats");function readStore(k,f=[]){try{const v=localStorage.getItem(k);if(!v)return f;const x=JSON.parse(v);return Array.isArray(x)?x:f}catch(e){try{localStorage.removeItem(k)}catch(_){}return f}}function users(){return readStore("pg_users")}function tickets(){return readStore("pg_tickets")}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function me(){return localStorage.getItem("pg_me")||""}function showApp(){authPage.classList.add("hidden");app.classList.remove("hidden");render()}function showAuth(msg=""){authPage.classList.remove("hidden");app.classList.add("hidden");authMsg.textContent=msg;setTimeout(()=>an.focus(),50)}function register(){const n=an.value.trim(),p=ap.value;if(!n||!p){authMsg.textContent="لطفاً نام و رمز را کامل وارد کن.";return}const u=users(),x=u.find(a=>String(a.n||"").toLowerCase()===n.toLowerCase());if(x&&x.p!==p){authMsg.textContent="رمز این حساب اشتباه است.";return}if(!x){u.push({n,p});save("pg_users",u)}localStorage.setItem("pg_me",n);showApp()}$("continueBtn").addEventListener("click",register);[an,ap].forEach(e=>e.addEventListener("keydown",x=>{if(x.key==="Enter"){x.preventDefault();register()}}));function render(){games.innerHTML=G.map((g,i)=>`<article class="card"><div class="cover"><img src="${g[1]}" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><div class="fallback hidden">${g[0]}</div></div><div class="body"><h3>${g[0]}</h3><p>مشاهده مشخصات و ثبت تیکت</p><button class="btn" onclick="gameOpen(${i})">ورود به بازی</button></div></article>`).join("");who.textContent=me()?`حساب فعال: ${me()}`:"برای استفاده از سایت حساب بساز یا وارد شو."}function gameOpen(i){if(!me()){showAuth("اول وارد حساب شو.");return}cur=i;gt.textContent=G[i][0];gi.innerHTML=`<div class="req"><b>مشخصات لازم:</b><br>${G[i][2]}</div><p class="muted">بعد از بررسی، نتیجه و پیام مدیر در «چک تیکت» دیده می‌شود.</p>`;$("game").classList.remove("hidden")}function gameClose(){$("game").classList.add("hidden")}function ticketOpen(){gameClose();tg.textContent="بازی: "+G[cur][0];tn.value=me();ti.value="";ta.value="";td.value="";sent.innerHTML="";$("ticket").classList.remove("hidden")}function ticketClose(){$("ticket").classList.add("hidden")}function nextTicketNumber(a){let max=0;a.forEach(t=>{const m=String(t.id||"").match(/^PG-(\d+)$/);if(m)max=Math.max(max,Number(m[1]))});return "PG-"+String(max+1).padStart(4,"0")}function newCode(a){let c;do{c="PGC-"+Math.random().toString(36).slice(2,8).toUpperCase()}while(a.some(t=>t.code===c));return c}function send(){const a=tickets(),id=nextTicketNumber(a),code=newCode(a);a.push({id,code,g:G[cur][0],u:me(),n:tn.value.trim(),i:ti.value.trim(),a:ta.value.trim(),d:td.value.trim(),s:"در حال بررسی",r:"",score:null,createdAt:Date.now()});save("pg_tickets",a);sent.innerHTML=`<div class="req">تیکت با موفقیت ثبت شد.<br><b>شماره تیکت:</b> <span class="code">${id}</span><br><b>کد پیگیری:</b> <span class="code">${code}</span><br>این دو مورد را برای پیگیری نگه دار.</div>`}function checkOpen(){check.classList.remove("hidden");check.scrollIntoView({behavior:"smooth"})}function checkClose(){check.classList.add("hidden")}function checkTicket(){const id=cid.value.trim().toUpperCase(),code=ccode.value.trim().toUpperCase(),t=tickets().find(x=>String(x.id).toUpperCase()===id&&String(x.code).toUpperCase()===code);cres.innerHTML=t?`<div class="ticket"><b>${t.g}</b><p><b>شماره:</b> ${t.id} | <b>کد:</b> ${t.code}</p><p>وضعیت: <span class="status">${t.s}</span></p><p>${t.r||"هنوز پاسخی ثبت نشده."}</p>${t.score==null?"":`<p><b>نمره:</b> ${t.score} از 20</p>`}</div>`:'<div class="req">تیکت پیدا نشد. شماره و کد پیگیری را دقیق وارد کن.</div>'}function accountOpen(){if(!me()){showAuth();return}ainfo.innerHTML=`<p><b>نام حساب:</b> ${me()}</p><p class="muted">حساب روی این دستگاه ذخیره شده است.</p>`;acc.classList.remove("hidden")}function accountClose(){acc.classList.add("hidden")}function logout(){localStorage.removeItem("pg_me");accountClose();showAuth("از حساب خارج شدی.")}function adminLogin(){if(prompt("رمز مدیر:")===ADMIN){acc.classList.add("hidden");admin.classList.remove("hidden");adminRender()}else alert("رمز مدیر اشتباه است.")}function adminClose(){admin.classList.add("hidden")}function ticketEditor(t,i){return `<div class="ticket"><div class="ticketHead"><div><b>${t.g} — ${t.id}</b><br><span class="small">کد پیگیری: <span class="code">${t.code||"قدیمی/بدون کد"}</span></span></div><span class="status">${t.s}</span></div><p class="muted">کاربر: ${t.u} | اسم: ${t.n||"-"} | آیدی: ${t.i||"-"} | اکانت: ${t.a||"-"}</p><p>${t.d||"بدون توضیح"}</p><div class="adminTools"><div><label class="small">وضعیت</label><select id="st${i}"><option ${t.s==="در حال بررسی"?"selected":""}>در حال بررسی</option><option ${t.s==="انجام شد"?"selected":""}>انجام شد</option><option ${t.s==="رد شد"?"selected":""}>رد شد</option></select></div><div><label class="small">نمره از 20</label><select id="sc${i}"><option value="">بدون نمره</option>${Array.from({length:21},(_,n)=>`<option value="${n}" ${String(t.score)===String(n)?"selected":""}>${n}</option>`).join("")}</select></div><div><label class="small">شناسه تیکت</label><input value="${t.id}" readonly></div></div><label class="small">پیام مدیر برای کاربر</label><textarea id="rr${i}" placeholder="پیام خودت را برای کاربر بنویس">${t.r||""}</textarea><div class="actions"><button class="pos" onclick="setT(${i})">💾 ذخیره تغییرات</button><button class="neg" onclick="quickT(${i},'رد شد')">❌ رد</button><button onclick="quickT(${i},'در حال بررسی')">⏳ بررسی</button><button class="pos" onclick="quickT(${i},'انجام شد')">✅ انجام شد</button></div><div class="req small"><b>برای پیگیری کاربر:</b> شماره تیکت <span class="code">${t.id}</span> و کد پیگیری <span class="code">${t.code||"-"}</span></div></div>`}function adminRender(){const all=tickets().slice().sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)),active=all.filter(t=>t.s!=="انجام شد"&&t.s!=="رد شد"),closed=all.filter(t=>t.s==="انجام شد"||t.s==="رد شد"),current=active[0],waiting=active.slice(1);adminStats.innerHTML=`کل تیکت‌ها: <b>${all.length}</b> | در صف: <b>${active.length}</b> | انجام‌شده/بسته: <b>${closed.length}</b> | نمره‌داده‌شده: <b>${all.filter(t=>t.score!=null).length}</b>`;let html=`<div class="queue"><h3 style="margin-top:0">🎫 نوبت فعلی مدیر</h3>${current?ticketEditor(current,all.indexOf(current)):"<p class=muted>فعلاً تیکت جدیدی در صف نیست.</p>"}</div>`;if(waiting.length)html+=`<div class="req"><b>تیکت‌های بعدی در صف:</b><br>${waiting.map((t,n)=>`${n+1}. ${t.g} — <span class="code">${t.id}</span> — ${t.u||"کاربر"}`).join("<br>")}</div>`;html+=`<div class="archive"><h3>📁 آرشیو تیکت‌های انجام‌شده و ردشده</h3><p class="muted">این بخش فقط آرشیو است؛ تیکت‌ها از سایت حذف نمی‌شوند و کاربر همیشه می‌تواند با شماره و کد پیگیری آن‌ها را چک کند.</p>${closed.length?closed.slice().reverse().map((t,i)=>ticketEditor(t,10000+i)).join(""):"<p class=muted>هنوز تیکت بسته‌شده‌ای وجود ندارد.</p>"}</div>`;alist.innerHTML=html}function setT(i){const a=tickets(),t=a.find((x,n)=>n===i);if(!t)return;t.s=$("st"+i).value;const v=$("sc"+i).value;t.score=v===""?null:Number(v);t.r=$("rr"+i).value;save("pg_tickets",a);adminRender()}function quickT(i,s){const a=tickets(),t=a.find((x,n)=>n===i);if(!t)return;t.s=s;t.r=$("rr"+i).value;save("pg_tickets",a);adminRender()}if(me())showApp();else showAuth();</script></body></html>

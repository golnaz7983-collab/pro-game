<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Pro Game</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Tahoma,Arial,sans-serif}.authPage{min-height:100vh;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px}.authCard{width:min(430px,100%);border:1px solid #e7e7e7;border-radius:18px;padding:28px;background:#fff;box-shadow:0 10px 35px #00000010}.authCard h1{text-align:center;margin:0 0 8px}.authCard .muted{text-align:center}.authCard .btn{margin-top:8px}header{height:64px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#fff;z-index:5}.logo{font-size:25px;font-weight:900}.logo span{font-weight:400}nav button,.ghost,.act{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}main{max-width:1150px;margin:auto;padding:28px 16px 60px}.hero h1{font-size:38px;margin:0 0 8px}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.card{border:1px solid #e7e7e7;border-radius:17px;overflow:hidden;box-shadow:0 6px 20px #00000009}.cover{height:165px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}.cover img{max-width:75%;max-height:115px}.fallback{font-size:30px;font-weight:900}.body{padding:16px}.body h3{margin:0 0 8px}.body p{color:#777;font-size:13px;min-height:34px}.btn{width:100%;border:0;background:#111;color:#fff;border-radius:10px;padding:11px;cursor:pointer}.btn:hover{background:#333}.box{border:1px solid #e5e5e5;border-radius:15px;padding:18px;margin-top:28px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}textarea{min-height:95px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.hidden,.hidden{display:none}.modalbox{width:min(500px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between}.req{background:#f7f7f7;padding:11px;border-radius:10px;margin:10px 0;font-size:13px}.ticket{border:1px solid #eee;padding:13px;border-radius:12px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{cursor:pointer;border:1px solid #ddd;background:#fff;padding:8px;border-radius:9px}.pos{background:#e8f7eb!important}.neg{background:#ffe8e8!important}.status{font-size:12px;padding:5px 8px;border-radius:15px;background:#eee}.done{background:#e8f7eb}.bad{background:#ffe8e8}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}.hero h1{font-size:30px}header{padding:0 12px}.authCard{padding:22px}}</style></head><body><section id="authPage" class="authPage"><div class="authCard"><h1>PRO GAME 🎮</h1><p class="muted">برای ورود به سایت، حساب خودت را بساز یا وارد شو.</p><div class="field"><label>نام</label><input id="an" autocomplete="username" placeholder="نام کاربری"></div><div class="field"><label>رمز</label><input id="ap" type="password" autocomplete="current-password" placeholder="رمز حساب"></div><button id="continueBtn" class="btn" type="button">ثبت نام و ادامه</button><p id="authMsg" class="muted"></p></div></section><div id="app" class="hidden"><header><div class="logo">PRO <span>GAME</span></div><nav><button onclick="checkOpen()">🔎 چک تیکت</button><button onclick="accountOpen()">👤 حساب</button></nav></header><main><div class="hero"><h1>Pro Game 🎮</h1><p class="muted">بازی را انتخاب کن، مشخصات را ببین و تیکت ثبت کن.</p></div><p id="who" class="muted"></p><div id="games" class="grid"></div><section id="check" class="box hidden"><div class="top"><h2>چک تیکت</h2><button class="ghost" onclick="checkClose()">بستن</button></div><div class="row"><div class="field"><label>شماره تیکت</label><input id="cid"></div><div class="field"><label>کد پیگیری</label><input id="ccode"></div></div><button class="btn" onclick="checkTicket()">بررسی</button><div id="cres"></div></section></main></div><div id="game" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="gt"></h2><button class="ghost" onclick="gameClose()">×</button></div><div id="gi"></div><button class="btn" onclick="ticketOpen()">🎫 ثبت تیکت</button></div></div><div id="ticket" class="modal hidden"><div class="modalbox"><div class="top"><h2>ثبت تیکت</h2><button class="ghost" onclick="ticketClose()">×</button></div><p id="tg" class="muted"></p><div class="row"><div class="field"><label>اسم</label><input id="tn"></div><div class="field"><label>آیدی</label><input id="ti"></div></div><div class="field"><label>نام اکانت</label><input id="ta"></div><div class="field"><label>توضیحات</label><textarea id="td"></textarea></div><button class="btn" onclick="send()">ارسال تیکت</button><div id="sent"></div></div></div><div id="acc" class="modal hidden"><div class="modalbox"><div class="top"><h2>حساب من</h2><button class="ghost" onclick="accountClose()">×</button></div><div id="ainfo"></div><button class="btn" onclick="adminLogin()">🔐 بخش مدیر</button><button class="btn" style="margin-top:8px" onclick="logout()">خروج</button></div></div><div id="admin" class="modal hidden"><div class="modalbox"><div class="top"><h2>مدیریت تیکت‌ها</h2><button class="ghost" onclick="adminClose()">بستن</button></div><div id="alist"></div></div></div><script>const ADMIN="promatin1234",G=[["Minecraft","https://cdn.simpleicons.org/minecraft/111111","نام کاربری، آیدی، نام اکانت و توضیحات"],["GTA V","https://cdn.simpleicons.org/grandtheftauto/111111","نام اکانت، آیدی و مشخصات درخواست"],["Counter-Strike 2","https://cdn.simpleicons.org/counterstrike/111111","آیدی، نام اکانت و توضیحات"],["Fortnite","https://cdn.simpleicons.org/fortnite/111111","Epic ID، نام اکانت و توضیحات"],["PUBG: BATTLEGROUNDS","https://cdn.simpleicons.org/pubg/111111","Player ID، نام اکانت و توضیحات"],["Call of Duty","https://cdn.simpleicons.org/callofduty/111111","Player ID، نام اکانت و توضیحات"],["Free Fire","https://cdn.simpleicons.org/freefire/111111","Player ID، نام اکانت و توضیحات"],["Roblox","https://cdn.simpleicons.org/roblox/111111","نام کاربری، آیدی و توضیحات"]];let cur=0;const an=document.getElementById('an'),ap=document.getElementById('ap'),continueBtn=document.getElementById('continueBtn'),authPage=document.getElementById('authPage'),authMsg=document.getElementById('authMsg'),app=document.getElementById('app'),games=document.getElementById('games'),who=document.getElementById('who'),gt=document.getElementById('gt'),gi=document.getElementById('gi'),tg=document.getElementById('tg'),tn=document.getElementById('tn'),ti=document.getElementById('ti'),ta=document.getElementById('ta'),td=document.getElementById('td'),sent=document.getElementById('sent'),check=document.getElementById('check'),cid=document.getElementById('cid'),ccode=document.getElementById('ccode'),cres=document.getElementById('cres'),ainfo=document.getElementById('ainfo'),acc=document.getElementById('acc'),admin=document.getElementById('admin'),alist=document.getElementById('alist');function readStore(k,fallback){try{let v=localStorage.getItem(k);if(!v)return fallback;let x=JSON.parse(v);return Array.isArray(x)?x:fallback}catch(e){try{localStorage.removeItem(k)}catch(_){}return fallback}}function users(){return readStore('pg_users',[])}function tickets(){return readStore('pg_tickets',[])}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){authMsg.textContent='ذخیره‌سازی مرورگر در دسترس نیست. حالت خصوصی/Incognito را ببند و دوباره امتحان کن.';console.error(e);return false}}function me(){try{return localStorage.getItem('pg_me')||''}catch(e){return ''}}function showApp(){authPage.classList.add('hidden');app.classList.remove('hidden');render()}function showAuth(msg=''){authPage.classList.remove('hidden');app.classList.add('hidden');authMsg.textContent=msg;setTimeout(()=>an.focus(),50)}function register(){let n=an.value.trim(),p=ap.value;if(!n||!p){authMsg.textContent='لطفاً نام و رمز را کامل وارد کن.';return}let u=users(),x=u.find(a=>String(a.n||'').toLowerCase()===n.toLowerCase());if(x&&x.p!==p){authMsg.textContent='رمز این حساب اشتباه است. اگر حساب قبلی را نمی‌خواهی، یک نام کاربری جدید بزن.';return}if(!x){u.push({n,p});if(!save('pg_users',u))return}try{localStorage.setItem('pg_me',n)}catch(e){authMsg.textContent='حساب ساخته شد، ولی مرورگر اجازه ذخیره ورود را نمی‌دهد.';console.error(e);return}authMsg.textContent='حساب ذخیره شد.';showApp()}continueBtn.addEventListener('click',register);[an,ap].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();register()}}));function render(){games.innerHTML=G.map((g,i)=>`<article class="card"><div class="cover"><img src="${g[1]}" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><div class="fallback hidden">${g[0]}</div></div><div class="body"><h3>${g[0]}</h3><p>مشاهده مشخصات و ثبت تیکت</p><button class="btn" onclick="gameOpen(${i})">ورود به بازی</button></div></article>`).join('');who.textContent=me()?`حساب فعال: ${me()}`:'برای استفاده از سایت حساب بساز یا وارد شو.'}function gameOpen(i){if(!me()){showAuth('اول وارد حساب شو.');return}cur=i;gt.textContent=G[i][0];gi.innerHTML=`<div class="req"><b>مشخصات لازم:</b><br>${G[i][2]}</div><p class="muted">بعد از بررسی، نتیجه و پیام مدیر در «چک تیکت» دیده می‌شود.</p>`;document.getElementById('game').classList.remove('hidden')}function gameClose(){document.getElementById('game').classList.add('hidden')}function ticketOpen(){gameClose();tg.textContent='بازی: '+G[cur][0];tn.value=me();document.getElementById('ticket').classList.remove('hidden')}function ticketClose(){document.getElementById('ticket').classList.add('hidden')}function send(){let a=tickets(),id='PG-'+Date.now().toString(36).toUpperCase(),code=Math.random().toString(36).slice(2,8).toUpperCase();a.push({id,code,g:G[cur][0],u:me(),n:tn.value,i:ti.value,a:ta.value,d:td.value,s:'در حال بررسی',r:'',score:null});save('pg_tickets',a);sent.innerHTML=`<div class="req">ثبت شد!<br><b>شماره:</b> ${id}<br><b>کد:</b> ${code}<br>این دو مورد را نگه دار.</div>`}function checkOpen(){check.classList.remove('hidden');check.scrollIntoView({behavior:'smooth'})}function checkClose(){check.classList.add('hidden')}function checkTicket(){let t=tickets().find(x=>x.id==cid.value.trim().toUpperCase()&&x.code==ccode.value.trim().toUpperCase());cres.innerHTML=t?`<div class="ticket"><b>${t.g}</b> — <span class="status">${t.s}</span><p>${t.r||'هنوز پاسخی ثبت نشده.'}</p>${t.score===null?'':`ارزیابی: ${t.score>0?'مثبت 👍':'منفی 👎'}`}</div>`:'<div class=req>تیکت پیدا نشد.</div>'}function accountOpen(){if(!me()){showAuth();return}ainfo.innerHTML=`<p><b>نام حساب:</b> ${me()}</p><p class=muted>حساب روی این دستگاه ذخیره شده است.</p>`;acc.classList.remove('hidden')}function accountClose(){acc.classList.add('hidden')}function logout(){try{localStorage.removeItem('pg_me')}catch(e){}accountClose();showAuth('از حساب خارج شدی. برای ورود دوباره مشخصاتت را وارد کن.')}function adminLogin(){if(prompt('رمز مدیر:')===ADMIN){acc.classList.add('hidden');admin.classList.remove('hidden');adminRender()}else alert('رمز مدیر اشتباه است.')}function adminClose(){admin.classList.add('hidden')}function adminRender(){let a=tickets().sort((x,y)=>y.id.localeCompare(x.id));alist.innerHTML=a.length?a.map((t,i)=>`<div class=ticket><div class=top><b>${t.g} — ${t.id}</b><span class=status>${t.s}</span></div><p class=muted>کاربر: ${t.u} | اسم: ${t.n} | آیدی: ${t.i} | اکانت: ${t.a}</p><p>${t.d||'بدون توضیح'}</p><textarea id="rr${i}" placeholder="متن پاسخ مدیر">${t.r||''}</textarea><div class=actions><button class=pos onclick="setT(${i},'انجام شد',1)">✅ انجام شد + مثبت</button><button class=neg onclick="setT(${i},'رد شد',-1)">❌ رد + منفی</button><button onclick="setT(${i},'در حال بررسی',null)">⏳ بررسی</button></div></div>`).join(''):'<p class=muted>هنوز تیکتی ثبت نشده.</p>'}function setT(i,s,score){let a=tickets().sort((x,y)=>y.id.localeCompare(x.id)),t=a[i];if(!t)return;t.s=s;t.score=score;t.r=document.getElementById('rr'+i).value;save('pg_tickets',a);adminRender()}if(me())showApp();else showAuth();</script></body></html>
